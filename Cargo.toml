[package]
name = "wabotrust"
version = "0.1.0"
edition = "2024"
authors = ["sanzydev"]
repository = "https://github.com/sanzydev/WaBot-Rust"

[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
async-trait = "0.1"
